name: rust-bench-burst
# Spec §14 research, sccache on the GitHub cache.
#   Run 39968589984 (earlier version of this file): 5 parallel cold bosun jobs (198 cache writes
#   each) lost 99-157 writes per job to 429 RateLimited on CreateCacheEntry.
#   Now: one cold job, then one warm job, with nothing else uploading (solo), then sccache's
#   documented setup (no ACTIONS_CACHE_SERVICE_V2) alone.
on:
  workflow_dispatch:
  push:
    branches: [claude/rust-cache-research]
    paths: [.github/workflows/rust-bench-burst.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  SCCACHE_VERSION: v0.18.0

jobs:
  solo:
    strategy:
      max-parallel: 1
      matrix:
        phase: [cold, warm, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: keelstackhq/bosun
      - run: rustup show active-toolchain || rustup toolchain install
      - run: |
          curl -sSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv sccache-*/sccache /usr/local/bin/
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            const docs = '${{ matrix.phase }}' === 'docs';
            core.exportVariable('SCCACHE_GHA_VERSION', `solo-${context.runId}${docs ? '-docs' : ''}`);
            if (!docs) core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
      - run: cargo fetch --locked
      - if: matrix.phase == 'warm'
        run: echo "// bench change" >> src/lib.rs
      - name: build
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_LOG: warn
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache.log
        run: |
          set -euo pipefail
          sccache --start-server
          echo "start $(date -u +%T)"
          s=$(date +%s.%N)
          cargo test --locked --no-run 2>&1 | tail -1
          t1=$(echo "$(date +%s.%N) - $s" | bc)
          s=$(date +%s.%N)
          cargo clippy --all-targets --locked 2>&1 | tail -1
          t2=$(echo "$(date +%s.%N) - $s" | bc)
          echo "end $(date -u +%T)"
          sccache --show-stats
          echo "RESULT solo ${{ matrix.phase }} cpus=$(nproc) test-build=${t1}s clippy=${t2}s"
          grep -v NotFound "$RUNNER_TEMP/sccache.log" | grep -oE 'write failed [A-Za-z]+.{0,200}' | cut -c1-260 | sort | uniq -c | sort -rn | head -3 || true
