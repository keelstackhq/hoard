# cargo-deny policy for `bosun gate deps` (cargo deny check). Licenses: only permissive ones.
# No blanket allow-all and no advisory ignores.
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-root-certs (root CA data)
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[advisories]
# Each ignore was approved by the owner. Remove it when the note's condition is met.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing attack) is pulled in by opendal-service-ghac's hard dependency on opendal-service-azblob (reqsign-azure-storage) and reqsign-core; hoard never uses Azure or RSA signing, and no opendal feature turns it off. Remove when opendal drops rsa or rsa ships a fix." },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained (no vulnerability); pulled in by aws-smithy-http, aws-smithy-runtime and aws-smithy-types (aws-sdk-s3). Remove when the AWS SDK stops using it." },
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (no vulnerability); a direct dependency of hoard (clock only). Remove when hoard moves to another time crate or chrono is maintained again." },
]
