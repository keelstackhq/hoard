# Body of CircleCI command `hoard` (commands/hoard.yml). hull vendors this byte-identically; change it here first.
description: Start or stop hoard; fs storage lives in CircleCI caches, r2 reads HOARD_R2_* from a context.
parameters:
  step:
    type: enum
    enum: [start, stop]
  version:
    type: string
  storage:
    type: enum
    enum: [fs, r2]
    default: fs
steps:
  - when:
      condition:
        and: [equal: [start, << parameters.step >>], equal: [fs, << parameters.storage >>]]
      steps:
        - restore_cache:
            keys:
              - hoard-v1-{{ .Branch }}-{{ .Revision }}
              - hoard-v1-{{ .Branch }}-
              - hoard-v1-main-
  - when:
      condition:
        equal: [start, << parameters.step >>]
      steps:
        - run:
            command: |
              echo 'export HOARD_PORT_FILE=/tmp/hoard/port HOARD_TOKEN_FILE=/tmp/hoard/token HOARD_PID_FILE=/tmp/hoard/pid HOARD_LOG_FILE=/tmp/hoard/log HOARD_SUMMARY_FILE=/tmp/hoard/summary.md PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
              . "$BASH_ENV"
              # A download problem must not fail the build: turbo then runs without the remote cache.
              if ! curl -fsSL https://raw.githubusercontent.com/keelstackhq/hoard/v<< parameters.version >>/scripts/install.sh | HOARD_VERSION=<< parameters.version >> sh; then
                echo "hoard: install failed; continuing without the cache"; exit 0
              fi
              hoard serve --detach --storage << parameters.storage >> --fs-root ~/.cache/hoard
              # TURBO_TOKEN is a random localhost token, not a secret.
              hoard env >> "$BASH_ENV"
  - when:
      condition:
        equal: [stop, << parameters.step >>]
      steps:
        - run:
            when: always
            command: |
              hoard stop --summary markdown || echo "hoard: no server to stop"
              [ "<< parameters.storage >>" != fs ] || hoard prune --force --storage fs --fs-root ~/.cache/hoard --max-size 2GB || true
  - when:
      condition:
        and: [equal: [stop, << parameters.step >>], equal: [fs, << parameters.storage >>]]
      steps:
        - save_cache:
            when: always
            key: hoard-v1-{{ .Branch }}-{{ .Revision }}
            paths: [~/.cache/hoard]
