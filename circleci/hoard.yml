# Body of CircleCI command `hoard` (commands/hoard.yml). hull vendors this byte-identically; change it here first.
description: Start or stop hoard; fs storage lives in CircleCI caches (saved on the default branch only), r2 reads HOARD_R2_* from a context.
parameters:
  step:
    type: enum
    enum: [start, stop]
  version:
    type: string
  storage:
    type: enum
    enum: [fs, r2]
    default: fs
  default-branch:
    type: string
    default: main
  max-size:
    type: string
    default: 1GB
  mode:
    type: enum
    enum: [auto, read-write, read]
    default: auto
  sha256:
    type: string
    default: ""
steps:
  - when:
      condition:
        and: [equal: [start, << parameters.step >>], equal: [fs, << parameters.storage >>]]
      steps:
        - restore_cache:
            keys:
              - hoard-v1-<< parameters.default-branch >>~
  - when:
      condition:
        equal: [start, << parameters.step >>]
      steps:
        - run:
            command: |
              d="$(mktemp -d)"
              {
                echo "export HOARD_PORT_FILE='$d/port' HOARD_TOKEN_FILE='$d/token' HOARD_PID_FILE='$d/pid'"
                echo "export HOARD_LOG_FILE='$d/log' HOARD_SUMMARY_FILE='$d/summary.md'"
                echo 'export HOARD_SKIP=1 # cleared once this job installed hoard; stop skips until then'
                echo 'export PATH="$HOME/.local/bin:$PATH"'
              } >> "$BASH_ENV"
              . "$BASH_ENV"
              v='<< parameters.version >>'
              v="${v#v}"
              case "$v" in *[!0-9A-Za-z.-]*) echo "hoard: version has characters other than [0-9A-Za-z.-]" >&2; exit 1 ;; esac
              if ! printf '%s\n' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
                echo "hoard: version '$v' is not X.Y.Z" >&2; exit 1
              fi
              sha='<< parameters.sha256 >>'
              case "$sha" in *[!0-9a-f]*) sha=x ;; esac
              if [ -n "$sha" ] && [ "${#sha}" != 64 ]; then
                echo "hoard: sha256 must be 64 lowercase hex characters" >&2; exit 1
              fi
              get() { curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 "$@"; }
              pinned() { # never runs code fetched from the tag the pin distrusts
                case "$(uname -sm)" in "Linux x86_64") a=x86_64 ;; "Linux aarch64") a=aarch64 ;;
                  *) echo "hoard: no linux release for $(uname -sm)" >&2; return 1 ;; esac
                t="$(mktemp -d)" || return 1
                {
                  get -o "$t/h.tgz" "https://github.com/keelstackhq/hoard/releases/download/v$v/hoard-$a-unknown-linux-musl.tar.gz" &&
                    { echo "$sha  $t/h.tgz" | sha256sum -c --quiet - ||
                      { echo "hoard: the archive for $a-unknown-linux-musl does not match sha256 (the pin is per architecture; this runner is $(uname -m))" >&2; false; }; } &&
                    tar -xzf "$t/h.tgz" -C "$t" hoard &&
                    mkdir -p "$HOME/.local/bin" && install -m 0755 "$t/hoard" "$HOME/.local/bin/hoard"
                }
                rc=$?
                rm -rf "$t"
                return "$rc"
              }
              unpinned() { get "https://raw.githubusercontent.com/keelstackhq/hoard/v$v/scripts/install.sh" | HOARD_VERSION="$v" sh; }
              # A download problem must not fail the build: turbo then runs without the remote cache.
              inst=unpinned; if [ -n "$sha" ]; then inst=pinned; fi
              if ! "$inst"; then
                echo "hoard: install failed; continuing without the cache"; exit 0
              fi
              echo 'export HOARD_SKIP=' >> "$BASH_ENV" # `hoard` on PATH is now this job's
              mode='<< parameters.mode >>'
              if [ "$mode" = auto ]; then
                mode=read-write
                if [ '<< parameters.storage >>' = r2 ] && [ "${CIRCLE_BRANCH:-}" != '<< parameters.default-branch >>' ]; then
                  mode=read
                fi
              fi
              if hoard serve --detach --storage << parameters.storage >> --fs-root ~/.cache/hoard --mode "$mode"; then
                rc=0
              else
                rc=$?
              fi
              if [ "$rc" = 3 ]; then
                echo "hoard: server did not start; continuing without the cache"; exit 0
              fi
              if [ "$rc" != 0 ]; then
                exit "$rc"
              fi
              # TURBO_TOKEN is a random localhost token, not a secret.
              hoard env >> "$BASH_ENV"
  - when:
      condition:
        equal: [stop, << parameters.step >>]
      steps:
        - run:
            when: always
            command: |
              # Unset (start never ran) or 1 (no hoard installed): skip; empty: this job installed hoard.
              if [ "${HOARD_SKIP-1}" = 1 ]; then echo "hoard: not installed in this job; nothing to stop"; exit 0; fi
              hoard stop --summary markdown || echo "hoard: no server to stop"
              if [ '<< parameters.storage >>' = fs ]; then
                hoard prune --force --storage fs --fs-root ~/.cache/hoard --max-size '<< parameters.max-size >>' || true
              fi
  - when:
      condition:
        and:
          - equal: [stop, << parameters.step >>]
          - equal: [fs, << parameters.storage >>]
          - equal: [<< parameters.default-branch >>, << pipeline.git.branch >>]
      steps:
        - save_cache:
            when: always
            key: hoard-v1-<< parameters.default-branch >>~{{ .Revision }}
            paths: [~/.cache/hoard]
