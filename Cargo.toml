[package]
name = "keel-hoard"
version = "0.4.0"
edition = "2024"
description = "One-line CI cache for TypeScript monorepos"
license = "MIT"

[lib]
name = "hoard"
path = "src/lib.rs"

[[bin]]
name = "hoard"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
axum = "0.8.9"
bytes = { version = "1.12.1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
opendal = { version = "0.59.4", default-features = false, features = ["services-fs", "services-ghac", "services-s3", "http-transport-reqwest", "layers-timeout"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
zstd = "0.14.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["time"] }
