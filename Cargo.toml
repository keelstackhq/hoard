[package]
name = "keel-hoard"
version = "0.1.0"
edition = "2024"
description = "One-line CI cache for TypeScript monorepos"
license = "MIT"

[lib]
name = "hoard"
path = "src/lib.rs"

[[bin]]
name = "hoard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
