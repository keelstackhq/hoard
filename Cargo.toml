[package]
name = "keel-hoard"
version = "0.1.0"
edition = "2024"
description = "One-line CI cache for TypeScript monorepos"
license = "MIT"

[lib]
name = "hoard"
path = "src/lib.rs"

[[bin]]
name = "hoard"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
bytes = { version = "1.12.1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
opendal = { version = "0.59.4", default-features = false, features = ["services-fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
